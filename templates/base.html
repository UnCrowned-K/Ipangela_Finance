<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Profit Optimizer{% endblock %}</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('profit-theme');
                if (theme !== 'light') {
                    theme = 'dark';
                }
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% block styles %}{% endblock %}
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head_scripts %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-label="Notifications"></div>

    {% block header %}{% endblock %}

    <!-- Top navigation -->
    <header class="top-nav" id="topNav">
        <a href="{{ url_for('pages.home') }}" class="top-nav-brand" aria-label="Ipangela — home">
            <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
                <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/>
                <path d="M3 7.5 12 12l9-4.5"/>
                <path d="M12 12v9"/>
            </svg>
            <span class="top-nav-name">Ipangela</span>
        </a>

        <div class="top-nav-panel" id="navPanel">
            <nav class="top-nav-links" aria-label="Main navigation">
                <a href="{{ url_for('optimizer.optimizer') }}" {% if request.endpoint and request.endpoint.startswith('optimizer.') %}class="active" aria-current="page"{% endif %}><i data-lucide="trending-up"></i><span>Optimizer</span></a>
                <a href="{{ url_for('finance.finance') }}" {% if request.endpoint == 'finance.finance' %}class="active" aria-current="page"{% endif %}><i data-lucide="wallet"></i><span>Finance</span></a>
                <a href="{{ url_for('invoice.invoice') }}" {% if request.endpoint and request.endpoint.startswith('invoice.') %}class="active" aria-current="page"{% endif %}><i data-lucide="file-text"></i><span>Invoices</span></a>
                {% block nav_extra %}{% endblock %}
            </nav>
        </div>

        <div class="top-nav-actions">
            <button type="button" class="top-nav-btn theme-toggle" id="themeToggle"
                    aria-label="Toggle dark mode" aria-pressed="false">
                <i data-lucide="moon" class="theme-icon-dark"></i>
                <i data-lucide="sun" class="theme-icon-light"></i>
            </button>
            <div class="nav-user" id="navUser">
                <button type="button" class="top-nav-btn nav-user-toggle" id="navUserToggle" aria-label="Account menu" aria-expanded="false" aria-haspopup="true" aria-controls="navUserMenu">
                    <i data-lucide="circle-user"></i>
                    <i data-lucide="chevron-down" class="nav-user-caret"></i>
                </button>
                <div class="nav-user-menu" id="navUserMenu">
                    <a href="{{ url_for('pages.profile') }}"><i data-lucide="user"></i><span>Profile</span></a>
                    <a href="{{ url_for('pages.contact') }}"><i data-lucide="mail"></i><span>Contact</span></a>
                    <div class="nav-user-divider"></div>
                    <a href="{{ url_for('auth.logout') }}" class="nav-user-signout"><i data-lucide="log-out"></i><span>Sign Out</span></a>
                </div>
            </div>
            <button type="button" class="top-nav-hamburger" id="navHamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navPanel">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </header>

    <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
    </main>

    {% block scripts %}
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% endblock %}
</body>
</html>
